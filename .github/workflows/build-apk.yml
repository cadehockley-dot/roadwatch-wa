name: Build RoadWatch APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore Android project
        run: |
          cat bundle/chunk_00.b64 bundle/chunk_01.b64 bundle/chunk_02.b64 bundle/chunk_03.b64 bundle/chunk_04.b64 > roadwatch_android_project.zip.b64
          base64 --decode roadwatch_android_project.zip.b64 > roadwatch_android_project.zip
          mkdir -p src
          unzip -q roadwatch_android_project.zip -d src
          test -f src/roadwatch_android_project/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build debug APK
        working-directory: src/roadwatch_android_project
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp src/roadwatch_android_project/app/build/outputs/apk/debug/app-debug.apk RoadWatch-WA.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoadWatch-WA-APK
          path: RoadWatch-WA.apk
          if-no-files-found: error
